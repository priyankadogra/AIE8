[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai8-cert-challenge"
version = "0.1.0"
description = "AI-powered school events assistant with RAG and agentic reasoning"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core AI/ML
    "openai>=1.0.0",
    "langchain==0.1.20",
    "langchain-openai==0.1.0",
    "langchain-community==0.0.38",
    
    # Vector Database & RAG
    "qdrant-client>=1.7.0",
    "faiss-cpu>=1.7.0",
    
    # Data Processing
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pypdf>=3.0.0",
    "python-dateutil>=2.8.0",
    "dateparser>=1.1.0",
    "pydantic>=2.0.0",
    
    # Calendar & Events
    "icalendar>=5.0.0",
    
    # Web Interface
    "streamlit>=1.28.0",
    
    # Utilities
    "tqdm>=4.65.0",
    "python-dotenv>=1.0.0",
    "pathlib2>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
]

evaluation = [
    "ragas>=0.1.0",
    "datasets>=2.14.0",
    "evaluate>=0.4.0",
    "sentence-transformers>=2.2.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/ai8-cert-challenge"
Repository = "https://github.com/yourusername/ai8-cert-challenge"
Issues = "https://github.com/yourusername/ai8-cert-challenge/issues"

[project.scripts]
school-events = "app.streamlit_app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "evaluation*"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
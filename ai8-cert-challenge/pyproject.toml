[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai8-cert-challenge"
version = "0.1.0"
description = "AI8 Certification Challenge Project"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pypdf",
    "python-dateutil",
    "dateparser",
    "pydantic",
    "icalendar",
    "tqdm",
    "openai",
    "streamlit",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
